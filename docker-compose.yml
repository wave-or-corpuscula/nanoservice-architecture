services:
  postgres-db:
    image: postgres:16-alpine
    container_name: user-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservicetestdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
  
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-app
    ports:
      - "8888:8888"
    env_file:
      - ./user-service/.env
    environment:
      - DB_HOST=postgres-db
      - REDIS_HOST=redis
    depends_on:
      - postgres-db
      - redis
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
     - "6380:6379"
    command: redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge

