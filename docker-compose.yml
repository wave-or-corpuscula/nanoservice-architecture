services:
  user-postgres:
    image: postgres:16-alpine
    container_name: user-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
     - "8887:5432"
    volumes:
      - user-pg-volume:/var/lib/postgresql/data
    networks:
      - app-network

  order-postgres:
    image: postgres:16-alpine
    container_name: order-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderdb
    ports:
      - "9998:5432"
    volumes:
     - order-pg-volume:/var/lib/postgresql/data
    networks:
     - app-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
     - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
     - kafka-volume:/var/lib/kafka/data
    networks:
     - app-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service-app
    ports:
      - "8888:8888"
    env_file:
      - ./user-service/.env
    environment:
      - DB_HOST=user-postgres
      - REDIS_HOST=redis
    depends_on:
      - user-postgres
      - redis
    networks:
      - app-network

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    container_name: order-service-app
    ports:
     - "9999:9999"
    env_file:
     - ./order-service/.env
    environment:
     - DB_HOST=order-postgres
     - DB_NAME=orderdb
     - GRPC_USER_HOST=user-service
     - KAFKA_BROKERS=kafka:19092
    depends_on:
     - order-postgres
     - kafka
    networks:
     - app-network

  notify-service-1:
    build:
      context: ./notification-service/
      dockerfile: Dockerfile
    env_file:
     - ./notification-service/.env
    environment:
     - KAFKA_GROUP_ID=consumer1
    depends_on:
     - kafka
    networks:
     - app-network

  notify-service-2:
    build:
      context: ./notification-service/
      dockerfile: Dockerfile
    env_file:
     - ./notification-service/.env
    environment:
     - KAFKA_GROUP_ID=consumer2
    depends_on:
     - kafka
    networks:
     - app-network

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    networks:
      - app-network

volumes:
  user-pg-volume:
  order-pg-volume:
  kafka-volume:

networks:
  app-network:
    driver: bridge

